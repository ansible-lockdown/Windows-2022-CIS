---

- name: "18.10.82.1 | PATCH | Ensure Configure the transmission of the user's password in the content of MPR notifications sent by winlogon. is set to Disabled"
  when: win22cis_rule_18_10_82_1
  tags:
    - level1-domaincontroller
    - level1-memberserver
    - rule_18.10.82.1
    - patch
    - logon
    - NIST800-171_3.4.2
    - NIST800-171_3.4.6
    - NIST800-171_3.4.7
    - NIST800-53R5_CM-6
    - NIST800-53R5_CM-7
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
    name: EnableMPR
    data: 0
    type: dword

- name: "18.10.82.2 | PATCH | Ensure Sign-in and lock last interactive user automatically after a restart is set to Disabled"
  when: win22cis_rule_18_10_82_2
  tags:
    - level1-domaincontroller
    - level1-memberserver
    - rule_18.10.82.2
    - patch
    - logon
    - NIST800-171_3.1.10
    - NIST800-53R5_AC-11
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System
    name: DisableAutomaticRestartSignOn
    data: 1
    type: dword
