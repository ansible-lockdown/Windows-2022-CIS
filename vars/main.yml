---

# vars file for Windows-2022-CIS

# Kept in step with meta/main.yml; tasks/main.yml asserts against it.
min_ansible_version: "2.16.1"

# Used to control warning summary
warn_control_list: ""
warn_count: 0

# lockdown_banner sets the variable that is created for the banner.
lockdown_banner: "{{ lookup('file', './templates/banner.txt') }}"

# These are default values that will be changed when the prelim
# runs and finds the correct setting.
prelim_win22cis_is_standalone: false
prelim_win22cis_is_domain_controller: false
prelim_win22cis_is_domain_member: false

# Set true in prelim when the host is domain joined. The Default Domain Policy owns
# [System Access] on such a host and overwrites any local write at every policy refresh.
prelim_win22cis_account_policy_is_domain_scoped: false

# Read from secedit in section01, after 1.2.2 has enabled lockout. Windows rejects a
# LockoutDuration lower than the current ResetLockoutCount, so 1.2.1 needs the pair as
# 1.2.2 leaves it - reading it in prelim gives the stock 0/0 and the decision is stale.
discovered_win22cis_current_lockout_duration: 0
discovered_win22cis_current_lockout_reset: 0

# Default setting, this should not be changed
# and is overridden if a task that changed sets the value if required.
reboot_host: false
